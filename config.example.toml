# Paths are relative to the directory of this file.
input = "data/input"
output = "data/output/consolidated.xlsx"
log_file = "data/output/consolidation.log"
# formats = ["xlsx", "xls", "csv"]
# xlsx (default), csv or both. With both, output must end in .xlsx.
# output_format = "both"
# Try both exports with this configuration.
# .venv/bin/python -m excel_consolidator --config config.example.toml --output-format both --json

[quality]
# Optional standardisation.
trim_text = false
normalize_numbers = false
dates_iso = false
# Optional duplicate removal and the columns used as key.
remove_duplicates = false
key = ["product"]

# Omit both CSV settings to detect them and log the choices.
# [csv]
# encoding = "utf-8"
# delimiter = ";"
