[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-consolidator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]
ui = ["customtkinter>=5.2"]

[tool.setuptools.packages.find]
where = ["src"]
